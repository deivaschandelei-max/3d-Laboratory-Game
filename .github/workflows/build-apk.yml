
name: Build 3D Laboratory Game APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          unzip -o 3D-Laboratory-Game-Android-Project.zip
          cp -r 3d-laboratory-android/.github/workflows /tmp/workflows
          echo "PROJECT_DIR=3d-laboratory-android" >> "$GITHUB_ENV"

      - name: Build APK
        uses: gradle/actions/setup-gradle@v4
      - name: Compile Android app
        run: |
          cd 3d-laboratory-android
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 3D-Laboratory-Game-APK
          path: 3d-laboratory-android/app/build/outputs/apk/debug/app-debug.apk
